<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hatchly — Screens</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #FAFAF8; color: #1A1814;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 40px 48px 28px; border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { color: #6B6560; font-size: 14px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 28px; padding: 36px 48px 80px;
  }
  figure {
    margin: 0; border: 1px solid rgba(0,0,0,0.08); border-radius: 14px; overflow: hidden;
    background: #fff; box-shadow: 0 1px 2px rgba(20,15,5,0.04), 0 1px 8px rgba(20,15,5,0.03);
    transition: box-shadow 180ms ease, transform 180ms ease;
  }
  figure:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(20,15,5,0.10); }
  figure a { display: block; }
  figure img { display: block; width: 100%; height: auto; border-bottom: 1px solid rgba(0,0,0,0.06); background: #FAFAF8; }
  figcaption { padding: 12px 16px; display: flex; align-items: baseline; gap: 10px; }
  .num { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; color: #B8820A; }
  .name { font-size: 14px; font-weight: 500; }
  .grp { padding: 8px 48px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A09890; grid-column: 1 / -1; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h1>Hatchly — All Screens</h1>
    <div class="sub">22 captures · click any frame to open full size</div>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const shots = [
      ["Marketing & onboarding", [
        ["01","Marketing landing","01-marketing.png"],
        ["02","How it works","02-how-it-works.png"],
        ["03","Sign up","03-auth-signup.png"],
        ["04","Log in","04-auth-login.png"],
        ["05","Model key setup","05-key-setup.png"],
      ]],
      ["Dashboard", [
        ["06","Your ideas","06-dashboard.png"],
        ["07","Imported ideas","07-dashboard-imported.png"],
        ["08","Account menu","08-account-menu.png"],
      ]],
      ["Workspace — Loop (validation)", [
        ["09","Overview","09-loop-overview.png"],
        ["10","Memory","10-loop-memory.png"],
        ["11","Scorecard","11-loop-scorecard.png"],
        ["12","Plan","12-loop-plan.png"],
        ["13","Brand","13-loop-brand.png"],
        ["14","Apps","14-loop-apps.png"],
      ]],
      ["Workspace — other phases", [
        ["15","Pantry · Overview (ideation)","15-pantry-overview.png"],
        ["16","Drop · Plan (launch)","16-drop-plan.png"],
        ["17","Drop · Apps (launch)","17-drop-apps.png"],
      ]],
      ["Settings", [
        ["18","Profile","18-settings-profile.png"],
        ["19","Model key","19-settings-model-key.png"],
        ["20","Billing","20-settings-billing.png"],
        ["21","Notifications","21-settings-notifications.png"],
        ["22","Security","22-settings-security.png"],
      ]],
    ];
    const grid = document.getElementById("grid");
    shots.forEach(([group, items]) => {
      const g = document.createElement("div");
      g.className = "grp"; g.textContent = group;
      grid.appendChild(g);
      items.forEach(([num, name, file]) => {
        const fig = document.createElement("figure");
        fig.innerHTML = `<a href="screens/${file}" target="_blank" rel="noopener">
            <img src="screens/${file}" alt="${name}" loading="lazy" />
          </a>
          <figcaption><span class="num">${num}</span><span class="name">${name}</span></figcaption>`;
        grid.appendChild(fig);
      });
    });
  </script>
</body>
</html>
